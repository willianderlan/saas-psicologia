{% extends 'base.html' %}

{% block content %}

<div class="row justify-content-center">

    <div class="col-md-4">

        <div class="card">

            <div class="card-body">

                <h3 class="mb-4">Login</h3>

                <form method="post">

                    {% csrf_token %}

                    {{ form.as_p }}

                    <button type="submit" class="btn btn-dark w-100">
                        Entrar
                    </button>

                </form>

            </div>

        </div>

    </div>

</div>

{% endblock %}
